name: Scan published package

# Runs n8n's community package scanner (the check n8n applies before verifying a node)
# against the version published on npm.
on:
  workflow_dispatch:
  push:
    branches:
      - n8n-verification-*

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Scan n8n-nodes-lassocut
        run: npx --yes @n8n/scan-community-package n8n-nodes-lassocut
